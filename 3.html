clamp(8px,1.7vw,24px) clamp(8px,3vw,48px);background:radial-gradient(ellipse at 50% 38%,#102c44 0%,#061325 69%)}.stage{position:relative;aspect-ratio:16/9;width:min(100%,calc((100dvh - 165px)*16/9));max-height:100%;background:#071324;box-shadow:0 26px 70px #0009,0 0 0 1px #7f9bb32b;overflow:hidden;isolation:isolate}.slide{position:absolute;inset:0;opacity:0;transform:translateX(4%) scale(1.025);transition:opacity .58s cubic-bezier(.2,.7,.2,1),transform .68s cubic-bezier(.2,.7,.2,1);pointer-events:none}.slide.current{opacity:1;transform:translateX(0) scale(1);pointer-events:auto;z-index:2}.slide.before{transform:translateX(-4%) scale(.99)}.slide img{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none}.hotspot{position:absolute;left:var(--x);top:var(--y);width:20px;height:20px;transform:translate(-50%,-50%);z-index:3;padding:0;border:1px solid #fff;background:rgba(18,193,205,.72);border-radius:50%;box-shadow:0 0 0 5px rgba(36,208,199,.22),0 0 15px rgba(36,208,199,.7);opacity:.82;transition:transform .2s,box-shadow .2s}.hotspot:hover{transform:translate(-50%,-50%) scale(1.4);box-shadow:0 0 0 10px #21dcc335}.hotspot:after{content:'';display:block;width:5px;height:5px;background:white;border-radius:50%;margin:auto}.hotspot:focus-visible{outline-offset:8px}.slide.current .hotspot{animation:hotIn .55s both}.hint{position:absolute;bottom:12px;right:15px;background:#061b2ab9;color:#c7f8f4;font-size:10px;padding:7px 9px;border:1px solid #53cdca55;border-radius:8px;z-index:4;pointer-events:none}footer{height:64px;display:flex;align-items:center;gap:16px;padding:0 clamp(15px,3vw,46px);background:#061426;border-top:1px solid var(--line)}.metas{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}.metas strong{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metas span{font-size:10px;color:var(--muted);letter-spacing:1px}.line{height:3px;position:absolute;bottom:64px;left:0;right:0;background:#1c344b}.l ';$('links').append(h);sources.forEach(([name,url])=>{let a=document.createElement('a');a.textContent=name+' ↗';a.href=url;a.target='_blank';a.rel='noopener noreferrer';$('links').append(a)})}$('modal').classList.add('show');$('closeModal').focus()}function closeModal(){modalOpen=false;$('modal').classList.remove('show')};function openOverview(){$('overview').classList.add('show');stopAuto()}function closeOverview(){$('overview').classList.remove('show')}function showInfo(){const s=SLIDES[current];showModal(s.detailTitle,s.detail,'SLIDE '+String(current+1).padStart(2,'0')+' / 10',s.sources)}function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2300)}function stopAuto(){if(playing){clearInterval(playing);playing=null;$('playBtn').style.color='';$('playBtn').title='자동 재생 (P)'}}function toggleAuto(){if(playing){stopAuto();toast('자동 재생 중지')}else{playing=setInterval(()=>{if(current===9){stopAuto();toast('마지막 슬라이드입니다')}else go(current+1)},6500);$('playBtn').style.color='#36ebd3';$('playBtn').title='자동 재생 중지';toast('6.5초 간격 자동 재생')}}$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('infoBtn').onclick=showInfo;$('gridBtn').onclick=openOverview;$('closeOverview').onclick=closeOverview;$('playBtn').onclick=toggleAuto;$('fsBtn').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>toast('전체 화면을 지원하지 않는 브라우저입니다'))}else document.exitFullscreen?.()};$('closeModal').onclick=closeModal;$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});$('overview').addEventListener('click',e=>{if(e.target===$('overview'))closeOverview()});window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeOverview();return}if(modalOpen||$('overview').classList.contains('show'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}else if(e.key==='Home')go(0);else if(e.key==='End')go(9);else if(e.key.toLowerCase()==='i')showInfo();else if(e.key.toLowerCase()==='g')openOverview();else if(e.key.toLowerCase()==='p')toggleAuto();else if(e.key.toLowerCase()==='f')$('fsBtn').click()});$('stagearea').addEventListener('wheel',e=>{if(modalOpen)return;if(Math.abs(e.deltaY)<12)return;e.preventDefault();if(Date.now()-lastWheel<780)return;lastWheel=Date.now();go(current+(e.deltaY>0?1:-1))},{passive:false});$('stagearea').addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX;touchY=e.changedTouches[0].screenY},{passive:true});$('stagearea').addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX,dy=e.changedTouches[0].screenY-touchY;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2)go(current+(dx<0?1:-1))},{passive:true});go(Math.min(9,Math.max(0,parseInt((location.hash.match(/slide-(\d+)/)||[])[1]||'1',10)-1)));</script></body></html>
